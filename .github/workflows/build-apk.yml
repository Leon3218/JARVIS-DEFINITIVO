name: JARVIS Definitivo - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar JARVIS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Localizar e extrair o projeto JARVIS
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::Nenhum arquivo ZIP do JARVIS foi encontrado no repositório."
            exit 1
          fi

          echo "ZIP encontrado: ${ZIP_FILE}"

          rm -rf jarvis_build
          mkdir -p jarvis_build

          unzip -q "${ZIP_FILE}" -d jarvis_build

          echo "Arquivos principais encontrados:"
          find jarvis_build -maxdepth 4 -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' \
          \) -print

      - name: Localizar raiz Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find jarvis_build -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -printf '%h\n' | head -n 1)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "::error::Não foi encontrada a raiz do projeto Gradle."
            exit 1
          fi

          if [ ! -f "${PROJECT_DIR}/app/build.gradle" ] && \
             [ ! -f "${PROJECT_DIR}/app/build.gradle.kts" ]; then
            echo "::error::O módulo app não foi encontrado em ${PROJECT_DIR}/app."
            exit 1
          fi

          echo "Raiz do projeto:"
          echo "${PROJECT_DIR}"

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          rm -rf /tmp/gradle-8.9

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "${GITHUB_PATH}"

          gradle --version

      - name: Verificar estrutura do Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== settings.gradle ==="
          cat settings.gradle

          echo
          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo
          echo "=== AndroidManifest.xml ==="
          cat app/src/main/AndroidManifest.xml

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Compilar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease

      - name: Verificar APKs gerados
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK DEBUG ==="

          find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print

          echo "=== APK RELEASE ==="

          find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print

          test -n "$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print -quit)"

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-DEFINITIVO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-DEFINITIVO-RELEASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
