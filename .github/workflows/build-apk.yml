name: JARVIS Definitivo - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar JARVIS Definitivo
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar V14
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./JARVIS_DEFINITIVO_V14_GITHUB_CORRIGIDO.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Arquivo V14 não encontrado."
            echo "Arquivos ZIP disponíveis:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "V14 encontrada:"
          ls -lh "$ZIP_FILE"

      - name: Extrair V14
        shell: bash
        run: |
          set -euo pipefail

          rm -rf jarvis_build
          mkdir -p jarvis_build

          unzip -q \
            "./JARVIS_DEFINITIVO_V14_GITHUB_CORRIGIDO.zip" \
            -d jarvis_build

          echo "Projeto extraído."

          find jarvis_build \
            -maxdepth 4 \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
            \) \
            -print

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(
            find jarvis_build \
              -type f \
              -name 'settings.gradle' \
              -printf '%h\n' \
              | head -n 1
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle não encontrado."
            find jarvis_build -maxdepth 6 -type f -print
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle não encontrado."
            exit 1
          fi

          echo "================================"
          echo "PROJETO JARVIS:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o /tmp/gradle.zip

          rm -rf /tmp/gradle-8.9

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Verificar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SETTINGS ==="
          cat settings.gradle

          echo
          echo "=== ROOT BUILD ==="
          cat build.gradle

          echo
          echo "=== APP BUILD ==="
          cat app/build.gradle

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Compilar APK Release
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleRelease

      - name: Verificar APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "APKs GERADOS"
          echo "================================"

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print

          DEBUG_APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::APK Debug não foi gerado."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::APK Release não foi gerado."
            exit 1
          fi

          echo "Debug: $DEBUG_APK"
          echo "Release: $RELEASE_APK"

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-DEFINITIVO-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-DEFINITIVO-RELEASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
